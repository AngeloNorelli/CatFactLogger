name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CatFactLogger.Tests/CatFactLogger.Tests.csproj

      - name: Build
        run: dotnet build CatFactLogger.Tests/CatFactLogger.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test CatFactLogger.Tests/CatFactLogger.Tests.csproj --no-build --no-restore --configuration Release --verbosity normal